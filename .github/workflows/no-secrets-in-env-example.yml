name: No secrets in .env.example

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if .env.example has a real value in a secret field
        run: |
          set -e
          SECRET_KEYS="APP_PASSWORD MAPY_API_KEY STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET STRAVA_REFRESH_TOKEN INTERVALS_API_KEY INTERVALS_ATHLETE_ID"
          FAIL=0
          for key in $SECRET_KEYS; do
            line=$(grep -E "^${key}=" .env.example || true)
            if [ -n "$line" ] && [ "$line" != "${key}=" ]; then
              echo "::error file=.env.example::${key} has a non-empty value in .env.example. This file is committed to a public repo - real values go in your local .env (gitignored) or in your host's Environment Variables (e.g. Vercel Project -> Settings -> Environment Variables), never here."
              FAIL=1
            fi
          done
          exit $FAIL
