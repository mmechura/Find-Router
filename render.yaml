services:
  - type: web
    name: find-router
    runtime: docker
    plan: free
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: MAPY_API_KEY
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: STRAVA_REDIRECT_URI
        sync: false
      - key: STRAVA_REFRESH_TOKEN
        sync: false
      - key: INTERVALS_API_KEY
        sync: false
      - key: INTERVALS_ATHLETE_ID
        sync: false
      - key: BASE_URL
        sync: false
